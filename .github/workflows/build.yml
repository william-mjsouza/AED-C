name: C/C++ CI
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Build DataStructures
      run: |
        msbuild src/DataStructures/DataStructures.sln `
          /p:Configuration=Release `
          /p:Platform="x64"

    - name: Build Exercises
      run: |
        msbuild exercises/LinkedList/LinkedListExercises/Exercise01/Exercise01.vcxproj `
          /p:Configuration=Release `
          /p:Platform="x64"